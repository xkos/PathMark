name: Build extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chromium
    outputs:
      basename: ${{ steps.package.outputs.basename }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chromium/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./public/manifest.json').version")"
          [[ "$PACKAGE_VERSION" == "$MANIFEST_VERSION" ]] || {
            echo "package.json and manifest.json versions differ" >&2
            exit 1
          }
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            [[ "${GITHUB_REF_NAME#v}" == "$MANIFEST_VERSION" ]] || {
              echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${MANIFEST_VERSION}" >&2
              exit 1
            }
          fi

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Validate static landing page
        working-directory: .
        run: |
          test -f web/index.html
          test -f web/en/index.html
          test -f web/zh-CN/index.html
          test -f web/_headers
          ! grep -R -E "pathmark\.(example|pages\.dev)" web
          grep -R "https://pathmark.elenchlab.app" web/en/index.html web/zh-CN/index.html web/robots.txt web/sitemap.xml

      - name: Package ZIP
        id: package
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          BASENAME="pathmark-chromium-${VERSION}"
          mkdir -p ../release
          (cd dist && zip -qr "../../release/${BASENAME}.zip" .)
          echo "basename=${BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.basename }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.basename }}
          path: release

      - name: Create signed CRX and checksums
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
          BASENAME: ${{ needs.build.outputs.basename }}
        run: |
          set -euo pipefail
          if [[ -z "${CRX_PRIVATE_KEY_B64:-}" ]]; then
            echo "Configure CRX_PRIVATE_KEY_B64 in the release environment before publishing a tag." >&2
            exit 1
          fi
          node chromium/scripts/pack-crx.mjs "release/${BASENAME}.zip" "release/${BASENAME}.crx"
          (cd release && sha256sum "${BASENAME}.zip" "${BASENAME}.crx" > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --generate-notes --verify-tag
